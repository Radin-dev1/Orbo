name: Deploy to Vercel

# Builds Orbo and ships it to Vercel on every push to main.
# Each run shows up under the repo's Deployments / Environments tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_ZbE8ozFL7yT0HsErpR56BE9x
  VERCEL_PROJECT_ID: prj_jPP4i6HUtUiTezOlaqNJuZgKEQa9
  # Supabase publishable (anon) credentials. These are safe to expose — they ship
  # in the browser bundle already and every table is guarded by row-level security.
  # Fork? Override them with repo-level Variables of the same name (Settings →
  # Secrets and variables → Actions → Variables).
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://qenpdjxjendvqlluwpnu.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_hIfT27cVJXsuU1uDjNnB4A_1udF4vZt' }}
  NEXT_PUBLIC_MAX_CALL_PARTICIPANTS: ${{ vars.NEXT_PUBLIC_MAX_CALL_PARTICIPANTS || '6' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed 🚀"
            echo ""
            echo "<$url>"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
